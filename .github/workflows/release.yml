name: Release

'on':
  push:
    tags:
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version for a test installer (e.g. 1.0.0); does not publish a release'
        required: true
        default: '1.0.0'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set release version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            version="$INPUT_VERSION"
          else
            version="${GITHUB_REF_NAME#v}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo 'Version must be MAJOR.MINOR.PATCH (tag: vMAJOR.MINOR.PATCH)' >&2
            exit 1
          fi
          echo "APP_VERSION=$version" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo 'BUILD_ARCH=universal' >> "$GITHUB_ENV"

      - name: Run tests
        run: swift test

      - name: Build and verify installer
        run: ./scripts/build_dmg.sh

      - name: Save installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: Notepad-${{ env.APP_VERSION }}-universal
          path: |
            dist/Notepad-${{ env.APP_VERSION }}-universal.dmg
            dist/Notepad-${{ env.APP_VERSION }}-universal.dmg.sha256
          if-no-files-found: error
          compression-level: 0

      - name: Publish GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          Download the DMG below, open it, and drag Notepad into Applications.
          Supports Apple silicon and Intel Macs running macOS 13 or later.

          This build is ad-hoc signed and not notarized. If macOS blocks it,
          use System Settings > Privacy & Security > Open Anyway after trying
          to open the app, if you trust its source.

          A SHA-256 checksum file is included alongside the installer.
          EOF
          gh release create "$GITHUB_REF_NAME" \
            "dist/Notepad-$APP_VERSION-universal.dmg" \
            "dist/Notepad-$APP_VERSION-universal.dmg.sha256" \
            --verify-tag --title "Notepad $APP_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md" --generate-notes

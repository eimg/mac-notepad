<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="codemirror/lib/codemirror.min.css">
  <style>
    :root {
      color-scheme: light dark;
      --editor-selection-background: color-mix(in srgb, AccentColor 50%, Canvas);
    }
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      background: transparent;
    }
    body {
      overflow: hidden;
      background: Canvas;
      color: CanvasText;
    }
    .CodeMirror {
      height: 100vh;
      background: Canvas;
      color: CanvasText;
      font-family: var(--editor-font-family, -apple-system);
      font-size: var(--editor-font-size, 14px);
      line-height: var(--editor-line-height, 1.5);
    }
    .CodeMirror-scroll {
      overflow: auto !important;
    }
    .CodeMirror-lines {
      padding: 16px 18px;
      padding-bottom: max(45vh, 180px);
    }
    .CodeMirror pre,
    .CodeMirror-line,
    .CodeMirror-line-like {
      line-height: var(--editor-line-height, 1.5);
    }
    .CodeMirror-gutters {
      display: none;
      background: transparent;
      border: 0;
    }
    .CodeMirror-cursor {
      border-left-color: CanvasText !important;
      transform: scaleY(0.72);
      transform-origin: center;
    }
    .CodeMirror-selected {
      background: var(--editor-selection-background) !important;
    }
    .CodeMirror-focused .CodeMirror-selected {
      background: var(--editor-selection-background) !important;
    }
    .CodeMirror-line::selection,
    .CodeMirror-line > span::selection,
    .CodeMirror-line > span > span::selection,
    span.CodeMirror-selectedtext::selection {
      background: var(--editor-selection-background) !important;
    }
    .CodeMirror-line::-moz-selection,
    .CodeMirror-line > span::-moz-selection,
    .CodeMirror-line > span > span::-moz-selection,
    span.CodeMirror-selectedtext::-moz-selection {
      background: var(--editor-selection-background) !important;
    }
    span.CodeMirror-selectedtext {
      background: transparent !important;
    }
    .notepad-search-match {
      background: color-mix(in srgb, AccentColor 22%, Canvas);
      border-radius: 2px;
    }
    .CodeMirror-placeholder {
      color: color-mix(in srgb, CanvasText 45%, transparent) !important;
    }
  </style>
</head>
<body>
  <textarea id="source"></textarea>
  <script src="codemirror/lib/codemirror.min.js"></script>
  <script src="codemirror/addon/display/placeholder.min.js"></script>
  <script src="codemirror/addon/search/searchcursor.js"></script>
  <script>
    const source = document.getElementById("source");
    const wrapper = document.documentElement;
    const selectionEndGutter = 18;
    let suppressSend = false;
    let searchQuery = "";
    let replacementText = "";
    let selectionClampFrame = null;
    let searchVisible = false;
    let searchRefreshTimer = null;
    let matches = [];
    let searchMarks = [];
    let lastResults = "";

    const editor = CodeMirror.fromTextArea(source, {
      dragDrop: false,
      lineWrapping: true,
      placeholder: "New note..."
    });

    editor.on("changes", () => {
      if (suppressSend) return;
      window.webkit.messageHandlers.notepadTextChanged.postMessage(editor.getValue());
      scheduleSearchRefresh();
    });

    editor.on("keydown", (_, event) => {
      if (event.key === "Escape" && searchVisible) {
        event.preventDefault();
        event.stopPropagation();
        window.webkit.messageHandlers.notepadCloseSearch.postMessage("close");
      }
    });

    function clampSelectionToEditorGutter() {
      selectionClampFrame = null;
      const editorRect = editor.getWrapperElement().getBoundingClientRect();
      const maxRight = editorRect.right - selectionEndGutter;
      document.querySelectorAll(".CodeMirror-selected").forEach((selection) => {
        const rect = selection.getBoundingClientRect();
        const overflow = rect.right - maxRight;
        if (overflow <= 0) return;

        const width = parseFloat(selection.style.width || `${rect.width}`);
        selection.style.width = `${Math.max(0, width - overflow)}px`;
      });
    }

    function scheduleSelectionClamp() {
      if (selectionClampFrame !== null) return;
      selectionClampFrame = requestAnimationFrame(clampSelectionToEditorGutter);
    }

    editor.on("cursorActivity", scheduleSelectionClamp);
    editor.on("cursorActivity", publishSearchResults);
    editor.on("scroll", scheduleSelectionClamp);
    editor.on("refresh", scheduleSelectionClamp);
    window.addEventListener("resize", scheduleSelectionClamp);

    function applyConfig(config) {
      wrapper.style.setProperty("--editor-font-family", config.fontFamily);
      wrapper.style.setProperty("--editor-font-size", `${config.fontSize}px`);
      wrapper.style.setProperty("--editor-line-height", `${config.lineHeight}`);
      editor.setOption("lineWrapping", config.wordWrap);
      editor.refresh();
      scheduleSelectionClamp();
    }

    function normalizeLineEndings(value) {
      return value.replace(/\r\n?/g, "\n");
    }

    function scheduleSearchRefresh() {
      if (searchRefreshTimer !== null) return;
      searchRefreshTimer = setTimeout(() => {
        searchRefreshTimer = null;
        rebuildSearch();
      }, 0);
    }

    function rebuildSearch() {
      matches = [];
      editor.operation(() => {
        searchMarks.forEach(mark => mark.clear());
        searchMarks = [];
        if (!searchVisible || !searchQuery) return;
        const cursor = editor.getSearchCursor(searchQuery, CodeMirror.Pos(0, 0));
        while (cursor.findNext()) {
          matches.push({from: cursor.from(), to: cursor.to()});
        }
        // Count every match; bound decorations so repetitive large notes remain responsive.
        searchMarks = matches.slice(0, 1000).map(match =>
          editor.markText(match.from, match.to, {className: "notepad-search-match"})
        );
      });
      publishSearchResults();
    }

    function flushSearch() {
      if (searchRefreshTimer !== null) {
        clearTimeout(searchRefreshTimer);
        searchRefreshTimer = null;
        rebuildSearch();
      }
    }

    function publishSearchResults() {
      const from = editor.getCursor("from");
      const to = editor.getCursor("to");
      const current = matches.findIndex(match =>
        CodeMirror.cmpPos(match.from, from) === 0 && CodeMirror.cmpPos(match.to, to) === 0
      ) + 1;
      const results = JSON.stringify({query: searchQuery, total: matches.length, current});
      if (results === lastResults) return;
      lastResults = results;
      window.webkit.messageHandlers.notepadSearchResults.postMessage(JSON.parse(results));
    }

    function getCursorForDirection(reverse, includeCurrent = false) {
      const start = editor.getCursor(reverse || includeCurrent ? "from" : "to");
      const cursor = editor.getSearchCursor(searchQuery, start);
      if (cursor.find(reverse)) return cursor;
      const lastLine = editor.lastLine();
      const wrapStart = reverse
        ? CodeMirror.Pos(lastLine, editor.getLine(lastLine).length)
        : CodeMirror.Pos(0, 0);
      const wrapped = editor.getSearchCursor(searchQuery, wrapStart);
      return wrapped.find(reverse) ? wrapped : null;
    }

    function find(reverse = false, includeCurrent = false) {
      flushSearch();
      if (!searchQuery) return;
      const cursor = getCursorForDirection(reverse, includeCurrent);
      if (!cursor) return;
      // Changing the selection must not take focus away from the Find field.
      editor.setSelection(cursor.from(), cursor.to());
      editor.scrollIntoView({from: cursor.from(), to: cursor.to()}, 60);
      publishSearchResults();
    }

    function replaceCurrent() {
      flushSearch();
      if (!searchQuery || matches.length === 0) return;
      const isSelectedMatch = () => matches.some(match =>
        CodeMirror.cmpPos(match.from, editor.getCursor("from")) === 0 &&
        CodeMirror.cmpPos(match.to, editor.getCursor("to")) === 0
      );
      if (!isSelectedMatch()) find(false, true);
      if (isSelectedMatch()) {
        editor.replaceSelection(replacementText, "end", "notepad-replace");
      }
      flushSearch();
      find(false);
    }

    function replaceAll() {
      flushSearch();
      if (!searchQuery || matches.length === 0) return;
      const replacements = matches.slice();
      editor.operation(() => {
        for (let i = replacements.length - 1; i >= 0; i -= 1) {
          const match = replacements[i];
          editor.replaceRange(replacementText, match.from, match.to, "notepad-replace-all");
        }
      });
      flushSearch();
      publishSearchResults();
    }

    window.notepad = {
      applyState(state) {
        applyConfig(state.preferences);
        if (editor.getValue() !== state.text) {
          const selections = editor.listSelections();
          suppressSend = true;
          editor.setValue(state.text);
          if (selections && selections.length > 0) {
            try {
              editor.setSelections(selections);
            } catch (_) {}
          }
          suppressSend = false;
          scheduleSelectionClamp();
          scheduleSearchRefresh();
        }
      },
      updateSearch(query, replacement, visible = true) {
        const nextQuery = normalizeLineEndings(query);
        const changed = nextQuery !== searchQuery || visible !== searchVisible;
        searchQuery = nextQuery;
        replacementText = normalizeLineEndings(replacement);
        searchVisible = visible;
        if (changed) {
          if (searchRefreshTimer !== null) clearTimeout(searchRefreshTimer);
          searchRefreshTimer = null;
          rebuildSearch();
          if (searchVisible && searchQuery) find(false, true);
        }
      },
      runSearchCommand(command) {
        switch (command) {
          case "focusEditor":
            editor.focus();
            break;
          case "useSelectionForFind":
            window.webkit.messageHandlers.notepadSelection.postMessage(editor.getSelection());
            break;
          case "findNext":
            find(false);
            break;
          case "findPrevious":
            find(true);
            break;
          case "replaceCurrent":
            replaceCurrent();
            break;
          case "replaceAll":
            replaceAll();
            break;
        }
      },
      focusEditor() {
        editor.focus();
      }
    };

  </script>
</body>
</html>
